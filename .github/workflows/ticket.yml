# Verifies that a pull request into main will close an open ticket of this repository. A pull request may close
# several; the branch is named however its author likes.
# GitHub resolves a closing keyword in the body and a link made under Development into one list, the pull
# request's closingIssuesReferences, and that list is what is checked. One job, `ticket`, which is the name the
# branch ruleset requires once this has reported green.

name: ticket

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: read
  pull-requests: read

jobs:
  ticket:
    name: ticket
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: Verify the pull request will close an open ticket
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o errexit -o nounset -o pipefail

          number=$(jq --raw-output '.pull_request.number' "${GITHUB_EVENT_PATH}")
          pull="https://github.com/${GITHUB_REPOSITORY}/pull/${number}"
          docs='https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/linking-a-pull-request-to-an-issue'

          # An annotation is plain text, so the links go into the job summary, which renders Markdown.
          refuse() {
            echo "::error::$1"
            printf '**%s.** %s\n\nSee [the pull request](%s) and [linking a pull request to an issue](%s).\n' \
              "$1" "$2" "${pull}" "${docs}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          }

          query=$(cat <<'GRAPHQL'
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                closingIssuesReferences(first: 20) {
                  nodes { number state repository { nameWithOwner } }
                }
              }
            }
          }
          GRAPHQL
          )
          refs=$(gh api graphql --field owner="${GITHUB_REPOSITORY_OWNER}" --field name="${GITHUB_REPOSITORY#*/}" \
            --field number="${number}" --raw-field query="${query}" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | "\(.number) \(.state) \(.repository.nameWithOwner)"')

          if [[ -z "${refs}" ]]
          then
            refuse 'the pull request will close no ticket' \
              'Write "Closes #<N>" in its body, or link the ticket under Development in its sidebar.'
          fi

          open_local=0
          while read -r n state repo
          do
            if [[ "${repo}" != "${GITHUB_REPOSITORY}" ]]
            then
              echo "::warning::${repo}#${n} belongs to another repository and is not checked here"
              continue
            fi
            if [[ "${state}" != OPEN ]]
            then
              echo "::warning::#${n} is ${state}; merging will not change it"
              continue
            fi
            open_local=$(( open_local + 1 ))
          done <<< "${refs}"

          if (( open_local == 0 ))
          then
            refuse 'none of the tickets this pull request will close is an open ticket of this repository' \
              'Name an open ticket of this repository; the ones named are closed or belong elsewhere.'
          fi
          echo "will close $(cut --delimiter=' ' --fields=1 <<< "${refs}" | sed 's/^/#/' | tr '\n' ' ')from branch '${GITHUB_HEAD_REF}'"
