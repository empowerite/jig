# Verifies that a pull request into main will close an open ticket of this repository, from a branch named for it.
# GitHub resolves a closing keyword in the body and a link made under Development into one list, the pull
# request's closingIssuesReferences, and that list is what is checked. One job, `ticket`, which is the name the
# branch ruleset requires once this has reported green.

name: ticket

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: read
  pull-requests: read

jobs:
  ticket:
    name: ticket
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: Verify the pull request will close an open ticket, from a branch named for it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o errexit -o nounset -o pipefail

          number=$(jq -r '.pull_request.number' "${GITHUB_EVENT_PATH}")
          query=$(cat <<'GRAPHQL'
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                closingIssuesReferences(first: 20) {
                  nodes { number state repository { nameWithOwner } }
                }
              }
            }
          }
          GRAPHQL
          )
          refs=$(gh api graphql -F owner="${GITHUB_REPOSITORY_OWNER}" -F name="${GITHUB_REPOSITORY#*/}" \
            -F number="${number}" -f query="${query}" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | "\(.number) \(.state) \(.repository.nameWithOwner)"')

          if [[ -z "${refs}" ]]
          then
            echo '::error::the pull request will close no ticket; write "Closes #<N>" in its body, or link the issue under Development'
            exit 1
          fi

          named=false
          while read -r n state repo
          do
            if [[ "${repo}" != "${GITHUB_REPOSITORY}" ]]
            then
              echo "::error::${repo}#${n} is not a ticket of this repository"
              exit 1
            fi
            if [[ "${state}" != OPEN ]]
            then
              echo "::error::#${n} is ${state}; a pull request closes an open ticket"
              exit 1
            fi
            case "${GITHUB_HEAD_REF}" in
              ("${n}"-*) named=true
            esac
          done <<< "${refs}"

          if [[ "${named}" != true ]]
          then
            echo "::error::branch '${GITHUB_HEAD_REF}' is not named <N>-<slug> for a ticket this pull request will close"
            exit 1
          fi
          echo "will close $(cut -d' ' -f1 <<< "${refs}" | sed 's/^/#/' | tr '\n' ' ')from branch '${GITHUB_HEAD_REF}'"
