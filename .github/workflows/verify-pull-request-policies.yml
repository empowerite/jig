# Verifies the policies a pull request must satisfy.
#
# A job's key is the check's name, the one the branch ruleset requires; renaming it breaks the requirement.

name: verify-pull-request-policies

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: read
  pull-requests: read

jobs:
  default-branch:
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: must-close-open-issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o errexit -o nounset -o pipefail

          repo_slug="${GITHUB_REPOSITORY}"
          repo_owner="${repo_slug%%/*}"
          repo_name="${repo_slug#*/}"
          pr_number=$(jq --raw-output '.pull_request.number' "${GITHUB_EVENT_PATH}")

          pull="https://github.com/${repo_slug}/pull/${pr_number}"
          issues="https://github.com/${repo_slug}/issues?q=is%3Aissue+is%3Aopen"
          docs='https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/linking-a-pull-request-to-an-issue'

          # error + remedy: the remedy is Markdown, read from stdin, written to the step summary
          refuse() {
            echo "::error::$1"
            { printf '### %s\n\n' "${1^}"; cat; } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          }

          query=$(cat <<'GRAPHQL'
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                closingIssuesReferences(first: 20) {
                  nodes { number state repository { nameWithOwner } }
                }
              }
            }
          }
          GRAPHQL
          )

          refs=$(gh api graphql \
            --field owner="${repo_owner}" \
            --field name="${repo_name}" \
            --field number="${pr_number}" \
            --raw-field query="${query}" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]
                  | "\(.number) \(.state) \(.repository.nameWithOwner)"')

          if [[ -z "${refs}" ]]
          then
            refuse 'this pull request closes no issue' <<REMEDY
          Link one under **Development** in [the sidebar](${pull}); pick from the [open issues](${issues}).
          See [linking a pull request to an issue](${docs}).
          REMEDY
          fi

          open_local=0
          while read -r n state repo
          do
            if [[ "${repo}" != "${repo_slug}" ]]
            then
              echo "::warning::skipping foreign issue ${repo}#${n}"
              continue
            fi
            if [[ "${state}" != OPEN ]]
            then
              echo "::warning::${repo}#${n} is ${state}; merging will not change it"
              continue
            fi
            open_local=$(( open_local + 1 ))
          done <<< "${refs}"

          if (( open_local == 0 ))
          then
            refuse 'every issue this pull request closes is already closed or belongs to another repository' <<REMEDY
          Link an open issue of this repository under **Development** in [the sidebar](${pull}); pick from the
          [open issues](${issues}).
          REMEDY
          fi

          closes=$(cut --delimiter=' ' --fields=1 <<< "${refs}" | sed 's/^/#/' | paste --serial --delimiters=' ')
          echo "closes ${closes}"
          printf 'Closes %s.\n' "${closes}" >> "${GITHUB_STEP_SUMMARY}"
