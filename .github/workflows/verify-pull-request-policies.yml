# Verifies the policies a pull request must satisfy: one job per scope, one step per policy.
#
# A job's key is the check's name, the one the branch ruleset requires; renaming it breaks the requirement.

name: verify-pull-request-policies

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  default-branch:
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: must-close-open-issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o errexit -o nounset -o pipefail

          repo_slug="${GITHUB_REPOSITORY}"
          repo_owner="${repo_slug%%/*}"
          repo_name="${repo_slug#*/}"
          pr=$(jq --raw-output '.pull_request.number' "${GITHUB_EVENT_PATH}")

          pull="${GITHUB_SERVER_URL}/${repo_slug}/pull/${pr}"
          run="${GITHUB_SERVER_URL}/${repo_slug}/actions/runs/${GITHUB_RUN_ID}"
          docs='https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/linking-a-pull-request-to-an-issue'

          # error + remedy: same markdown remedy for every refusal
          remedy=$(cat <<REMEDY
          Link an open issue of this repository under **Development** in [the sidebar](${pull}):

          1. click the gear (⚙) button beside **Development**
          2. pick one or more open issues
          3. [re-run this check](${run})

          Linking does not fire any event, so the check **must** be re-run.

          See: [linking a pull request to an issue](${docs}).
          REMEDY
          )

          refuse() {
            echo "::error::$1"
            printf '### ❌ %s\n\n%s\n' "${1^}" "${remedy}" | tee --append "${GITHUB_STEP_SUMMARY}"
            return 1
          }

          # first: 100 is the API's page maximum. Past it only a false refusal is possible, never a false pass.
          query=$(cat <<'GRAPHQL'
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                closingIssuesReferences(first: 100) {
                  nodes { number state repository { nameWithOwner } }
                }
              }
            }
          }
          GRAPHQL
          )

          refs=$(gh api graphql \
            --field owner="${repo_owner}" \
            --field name="${repo_name}"   \
            --field number="${pr}"        \
            --raw-field query="${query}"  \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]
                  | "\(.number) \(.state) \(.repository.nameWithOwner)"')

          if [[ -z "${refs}" ]]
          then
            refuse 'this pull request does not close any issues'
          else
            open_local=0
            while read -r n state repo
            do
              if [[ "${repo}" != "${repo_slug}" ]]
              then
                echo "::warning::skipping foreign issue ${repo}#${n}"
                continue
              fi
              if [[ "${state}" != OPEN ]]
              then
                echo "::warning::${repo}#${n} is ${state}; merging will not change it"
                continue
              fi
              open_local=$(( open_local + 1 ))
            done <<< "${refs}"

            if (( open_local == 0 ))
            then
              refuse 'every issue this pull request closes is already closed or belongs to another repository'
            else
              closes=$(cut --delimiter=' ' --fields=1 <<< "${refs}" | sed 's/^/#/' | paste --serial --delimiters=' ')
              printf '✅ Closes %s.\n' "${closes}" | tee --append "${GITHUB_STEP_SUMMARY}"
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ !cancelled() }}

      - name: links-resolve
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o errexit -o nounset -o pipefail

          pr=$(jq --raw-output '.pull_request.number' "${GITHUB_EVENT_PATH}")
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # error + remedy: same markdown remedy for every refusal
          remedy=$(cat <<REMEDY
          Each line above names the file, the line and the target that did not resolve. Fix the link, or write
          the file or heading it names, and push; then [re-run this check](${run}).
          REMEDY
          )

          refuse() {
            echo "::error::$1"
            printf '### ❌ %s\n\n%s\n' "${1^}" "${remedy}" | tee --append "${GITHUB_STEP_SUMMARY}"
            return 1
          }

          # GitHub's heading slug: lowercase, punctuation dropped, spaces to hyphens.
          slug() { tr '[:upper:]' '[:lower:]' | sed --expression='s/[^[:alnum:] -]//g' --expression='s/ /-/g'; }
          headings() { sed --quiet --expression='s/^#\{1,6\} \{1,\}//p' "$1" | slug; }

          # Every link outside a fenced block, as line<TAB>target.
          links() {
            awk '
              /^```/ { fence = !fence; next }
              !fence {
                while (match($0, /\]\([^)]+\)/)) {
                  print FNR "\t" substr($0, RSTART + 2, RLENGTH - 3)
                  $0 = substr($0, RSTART + RLENGTH)
                }
              }' "$1"
          }

          files=$(gh pr diff "${pr}" --name-only)
          broken=0
          while IFS= read -r file
          do
            [[ "${file}" == *.md && -f "${file}" ]] || continue
            found=$(links "${file}")
            [[ -n "${found}" ]] || continue
            while IFS=$'\t' read -r line target
            do
              case "${target}" in
                (http://*|https://*|mailto:*) continue
              esac
              path=${target%%#*}
              fragment=""
              [[ "${target}" == *#* ]] && fragment=${target#*#}
              if [[ -z "${path}" ]]
              then
                resolved=${file}
              else
                resolved=$(realpath --canonicalize-missing --relative-to=. "$(dirname "${file}")/${path}")
              fi
              if [[ ! -f "${resolved}" ]]
              then
                echo "::error file=${file},line=${line}::link to a file that is not there: ${target}"
                broken=$(( broken + 1 ))
                continue
              fi
              if [[ -n "${fragment}" ]] \
                && ! headings "${resolved}" | grep --quiet --line-regexp --fixed-strings "${fragment}"
              then
                echo "::error file=${file},line=${line}::link to a heading that is not there: ${target}"
                broken=$(( broken + 1 ))
              fi
            done <<< "${found}"
          done <<< "${files}"

          if (( broken > 0 ))
          then
            refuse "${broken} link(s) in this pull request's Markdown do not resolve"
          else
            printf '✅ Every link in the changed Markdown resolves.\n' | tee --append "${GITHUB_STEP_SUMMARY}"
          fi
