# Runs this repository's controls; see controls/1st.md. One job per event, and each job is one line of its own.
#
# A job's key is the check's name, the one the branch ruleset requires; renaming it breaks the requirement.

name: verify-pull-request-policies

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  default-branch:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - run: controls/run pull-request
        env:
          GH_TOKEN: ${{ github.token }}

  schedule:
    if: github.event_name == 'schedule'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - run: controls/run schedule
        env:
          GH_TOKEN: ${{ github.token }}
